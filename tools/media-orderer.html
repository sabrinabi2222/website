<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Builder</title>
  <style>
    :root {
      --bg: #f8f5f1;
      --ink: #181614;
      --muted: #6f6860;
      --line: #d8cec2;
      --card: #fff;
      --accent: #f2b76f;
      --ok: #1e7a44;
      --err: #a12727;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }

    .muted {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      padding: 14px;
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      border: 1px solid #b58a56;
      background: var(--accent);
      color: #261a08;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      border-color: var(--line);
      color: var(--ink);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    li.item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      display: grid;
      grid-template-columns: 30px 120px 1fr auto;
      gap: 10px;
      align-items: center;
      cursor: grab;
    }

    .dragging {
      opacity: 0.55;
    }

    .handle {
      text-align: center;
      color: var(--muted);
      user-select: none;
      font-size: 1.1rem;
      cursor: grab;
    }

    .thumb {
      width: 120px;
      height: 120px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #ece7e1;
      object-fit: cover;
    }

    .name {
      font-size: 0.95rem;
      word-break: break-word;
    }

    .type {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      min-height: 44px;
    }

    .status.ok {
      border-color: #9bc9ae;
      color: var(--ok);
      background: #eef9f2;
    }

    .status.err {
      border-color: #dfb4b4;
      color: var(--err);
      background: #fff2f2;
    }

    .small {
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      li.item {
        grid-template-columns: 24px 90px 1fr;
      }

      .thumb {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Project Builder</h1>
    <p class="muted">Pick media, drag to set order, fill project info, then click one button to add to the site JSON.</p>

    <section class="panel">
      <div class="grid">
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="sewing">Sewing</option>
            <option value="photography">Photography</option>
          </select>
        </div>
        <div>
          <label for="existingProject">Load Existing Project</label>
          <div class="row" style="margin:0;">
            <select id="existingProject" style="flex:1;">
              <option value="">-- choose project --</option>
            </select>
            <button id="loadProject" type="button" class="secondary">Load</button>
          </div>
        </div>
        <div>
          <label for="positionMode">Project Placement</label>
          <select id="positionMode">
            <option value="front">Front (newest first)</option>
            <option value="back">Back (oldest first)</option>
            <option value="keep">Keep current spot (when editing)</option>
            <option value="before">Before selected project</option>
            <option value="after">After selected project</option>
          </select>
        </div>
        <div>
          <label for="positionKey">Placement Target (for before/after)</label>
          <select id="positionKey">
            <option value="">-- choose target project --</option>
          </select>
        </div>
        <div>
          <label for="key">Project Key (no spaces)</label>
          <input id="key" type="text" placeholder="HeartCoasterSet" />
        </div>
        <div>
          <label for="title">Project Title</label>
          <input id="title" type="text" placeholder="Heart Coaster Set" />
        </div>
      </div>

      <div style="margin-top:10px;">
        <label for="caption">Caption</label>
        <textarea id="caption" placeholder="Short description for the project"></textarea>
      </div>

      <div class="row" style="margin-top:10px;">
        <div style="min-width:300px; flex:1;">
          <label for="prefix">Path Prefix (for local files)</label>
          <input id="prefix" type="text" placeholder="media/sewing/HeartCoasterSet/" />
        </div>
      </div>

      <div class="row">
        <button id="pickFolder" type="button">Choose Folder</button>
        <button id="pickFiles" type="button" class="secondary">Choose Files</button>
        <button id="clearAll" type="button" class="secondary">Clear Media</button>
        <label class="small" style="display:flex; align-items:center; gap:6px; margin:0 0 0 auto;">
          <input id="replace" type="checkbox" /> Replace existing project key
        </label>
        <label class="small" style="display:flex; align-items:center; gap:6px; margin:0;">
          <input id="dryRun" type="checkbox" /> Dry run (no file changes)
        </label>
      </div>

      <input id="folderInput" type="file" webkitdirectory directory multiple hidden />
      <input id="filesInput" type="file" multiple hidden />
      <p id="count" class="small">0 files selected</p>
    </section>

    <section class="panel">
      <div class="row">
        <strong>Media Order</strong>
        <span class="small">drag to reorder</span>
      </div>
      <ul id="list"></ul>
    </section>

    <section class="panel">
      <div class="row">
        <button id="submit" type="button">Add Project To Website</button>
      </div>
      <div id="status" class="status">Ready.</div>
      <p class="small" style="margin-top:10px;">
        Run this page using <code>python3 scripts/project_helper_server.py --port 4173</code> for one-click saving.
      </p>
    </section>
  </main>

  <script>
    const IMAGE_EXTS = new Set(["jpg", "jpeg", "png", "webp", "gif", "avif", "heic", "heif"]);
    const VIDEO_EXTS = new Set(["mp4", "mov", "m4v", "webm"]);

    const folderInput = document.getElementById("folderInput");
    const filesInput = document.getElementById("filesInput");
    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    const existingProjectEl = document.getElementById("existingProject");
    const positionKeyEl = document.getElementById("positionKey");

    let rows = [];
    let dragIndex = null;
    let nextRowId = 1;

    function extOf(name) {
      const dot = name.lastIndexOf(".");
      return dot >= 0 ? name.slice(dot + 1).toLowerCase() : "";
    }

    function typeOf(name) {
      const ext = extOf(name);
      if (IMAGE_EXTS.has(ext)) return "image";
      if (VIDEO_EXTS.has(ext)) return "video";
      return "other";
    }

    function fileNameOnly(pathLike) {
      return pathLike.split("/").pop().split("\\").pop();
    }

    function parseExifDateString(value) {
      if (!value) return null;
      const cleaned = String(value).replace(/\0/g, "").trim();
      const m = cleaned.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
      if (!m) return null;
      const [, y, mo, d, h, mi, s] = m;
      const ts = Date.parse(`${y}-${mo}-${d}T${h}:${mi}:${s}`);
      return Number.isNaN(ts) ? null : ts;
    }

    function parseExifFromJpeg(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      if (view.byteLength < 4 || view.getUint16(0, false) !== 0xffd8) return null;

      let offset = 2;
      while (offset + 4 <= view.byteLength) {
        const marker = view.getUint16(offset, false);
        offset += 2;
        if ((marker & 0xff00) !== 0xff00) break;
        if (marker === 0xffd9 || marker === 0xffda) break;
        const size = view.getUint16(offset, false);
        const segmentStart = offset + 2;
        const segmentEnd = offset + size;
        if (segmentEnd > view.byteLength) break;

        if (marker === 0xffe1 && size >= 10) {
          const exif =
            String.fromCharCode(view.getUint8(segmentStart + 0)) +
            String.fromCharCode(view.getUint8(segmentStart + 1)) +
            String.fromCharCode(view.getUint8(segmentStart + 2)) +
            String.fromCharCode(view.getUint8(segmentStart + 3));
          if (exif === "Exif") {
            const tiff = segmentStart + 6;
            const byteOrder = String.fromCharCode(view.getUint8(tiff)) + String.fromCharCode(view.getUint8(tiff + 1));
            const little = byteOrder === "II";
            if (!little && byteOrder !== "MM") return null;

            const get16 = (o) => view.getUint16(o, little);
            const get32 = (o) => view.getUint32(o, little);
            const readAscii = (count, valueOffsetField, entryOffset) => {
              let pos = valueOffsetField;
              if (count <= 4) pos = entryOffset + 8;
              const chars = [];
              for (let i = 0; i < count && pos + i < view.byteLength; i += 1) {
                const c = view.getUint8(pos + i);
                if (c === 0) break;
                chars.push(c);
              }
              return String.fromCharCode(...chars);
            };

            const readIfdDate = (ifdOffset) => {
              if (!ifdOffset || ifdOffset + 2 > view.byteLength) return null;
              const count = get16(ifdOffset);
              for (let i = 0; i < count; i += 1) {
                const entry = ifdOffset + 2 + i * 12;
                if (entry + 12 > view.byteLength) break;
                const tag = get16(entry);
                const type = get16(entry + 2);
                const components = get32(entry + 4);
                const valueOffset = get32(entry + 8);
                if (type === 2 && (tag === 0x9003 || tag === 0x9004 || tag === 0x0132)) {
                  const value = readAscii(components, tiff + valueOffset, entry);
                  const parsed = parseExifDateString(value);
                  if (parsed) return parsed;
                }
              }
              return null;
            };

            const ifd0Offset = tiff + get32(tiff + 4);
            const ifd0Date = readIfdDate(ifd0Offset);
            if (ifd0Date) return ifd0Date;

            const entries = get16(ifd0Offset);
            for (let i = 0; i < entries; i += 1) {
              const entry = ifd0Offset + 2 + i * 12;
              if (entry + 12 > view.byteLength) break;
              const tag = get16(entry);
              if (tag === 0x8769) {
                const exifIfd = tiff + get32(entry + 8);
                const exifDate = readIfdDate(exifIfd);
                if (exifDate) return exifDate;
              }
            }
          }
        }
        offset = segmentEnd;
      }
      return null;
    }

    async function captureTimestamp(file, type) {
      if (type === "image") {
        try {
          const ext = extOf(file.name);
          if (ext === "jpg" || ext === "jpeg") {
            const exifTs = parseExifFromJpeg(await file.arrayBuffer());
            if (exifTs) return exifTs;
          }
        } catch {
          // Fall back below.
        }
      }
      return file.lastModified || Date.now();
    }

    function sanitizePrefix(text) {
      const p = (text || "").trim();
      if (!p) return "";
      return p.endsWith("/") ? p : p + "/";
    }

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function previewUrl(url) {
      if (!url) return "";
      const raw = String(url);
      if (raw.startsWith("http://") || raw.startsWith("https://")) return raw;
      return "/" + raw.replace(/^\/+/, "");
    }

    function makePreview(row) {
      const src = row.sourceUrl ? previewUrl(row.sourceUrl) : (row.file ? URL.createObjectURL(row.file) : "");
      if (row.type === "image") {
        const img = document.createElement("img");
        img.className = "thumb";
        img.alt = row.relName || "image";
        if (src) img.src = src;
        img.draggable = false;
        return img;
      }
      if (row.type === "video") {
        const video = document.createElement("video");
        video.className = "thumb";
        if (src) video.src = src;
        video.muted = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.draggable = false;
        return video;
      }
      const box = document.createElement("div");
      box.className = "thumb";
      return box;
    }

    function render() {
      listEl.innerHTML = "";
      rows.forEach((row, idx) => {
        const li = document.createElement("li");
        li.className = "item";
        li.draggable = true;
        li.dataset.rowId = String(row.rowId);

        li.addEventListener("dragstart", () => {
          dragIndex = idx;
          li.classList.add("dragging");
        });

        li.addEventListener("dragend", () => {
          li.classList.remove("dragging");
          dragIndex = null;
        });

        li.addEventListener("dragover", (e) => {
          e.preventDefault();
          if (dragIndex === null || dragIndex === idx) return;
          const [moved] = rows.splice(dragIndex, 1);
          rows.splice(idx, 0, moved);
          dragIndex = idx;
          render();
        });

        const handle = document.createElement("div");
        handle.className = "handle";
        handle.textContent = "::";

        const preview = makePreview(row);

        const info = document.createElement("div");
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = row.relName;
        const type = document.createElement("div");
        type.className = "type";
        type.textContent = row.type;
        info.appendChild(name);
        info.appendChild(type);

        const remove = document.createElement("button");
        remove.className = "secondary";
        remove.type = "button";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          rows.splice(idx, 1);
          render();
        });

        li.appendChild(handle);
        li.appendChild(preview);
        li.appendChild(info);
        li.appendChild(remove);
        listEl.appendChild(li);
      });

      countEl.textContent = `${rows.length} file${rows.length === 1 ? "" : "s"} selected`;
    }

    async function addFiles(files) {
      const built = await Promise.all(
        Array.from(files).map(async (file) => {
          const rel = file.webkitRelativePath || file.name;
          const t = typeOf(rel);
          if (t === "other") return null;
          return {
            rowId: nextRowId++,
            file,
            type: t,
            relName: fileNameOnly(rel),
            sourceUrl: null,
            sortTs: await captureTimestamp(file, t),
          };
        }),
      );

      const incoming = built.filter(Boolean).sort((a, b) => a.sortTs - b.sortTs);
      rows = rows.concat(incoming);
      render();
      setStatus("Loaded media and auto-sorted by capture datetime (EXIF when available).", "");
    }

    function collectMediaPaths() {
      const prefix = sanitizePrefix(document.getElementById("prefix").value);
      return rows.map((row) => row.sourceUrl || `${prefix}${row.relName}`);
    }

    function inferPrefixFromItems(items) {
      const firstLocal = items.find((item) => item.url && !String(item.url).startsWith("http"));
      if (!firstLocal) return "";
      const normalized = String(firstLocal.url).replace(/\\/g, "/");
      const slash = normalized.lastIndexOf("/");
      if (slash < 0) return "";
      return normalized.slice(0, slash + 1);
    }

    async function refreshProjectList() {
      const category = document.getElementById("category").value;
      existingProjectEl.innerHTML = "<option value=\"\">-- choose project --</option>";
      positionKeyEl.innerHTML = "<option value=\"\">-- choose target project --</option>";
      try {
        const res = await fetch(`/api/list-projects?category=${encodeURIComponent(category)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Could not load project list");
        for (const project of data.projects || []) {
          const label = `${project.key} - ${project.title}`;

          const loadOpt = document.createElement("option");
          loadOpt.value = project.key;
          loadOpt.textContent = label;
          existingProjectEl.appendChild(loadOpt);

          const placeOpt = document.createElement("option");
          placeOpt.value = project.key;
          placeOpt.textContent = label;
          positionKeyEl.appendChild(placeOpt);
        }
      } catch (err) {
        setStatus(`Could not load project list. ${err.message}`, "err");
      }
    }

    async function loadProjectForEdit() {
      const category = document.getElementById("category").value;
      const key = existingProjectEl.value;
      if (!key) {
        setStatus("Choose a project to load first.", "err");
        return;
      }
      try {
        const res = await fetch(`/api/get-project?category=${encodeURIComponent(category)}&key=${encodeURIComponent(key)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Could not load project");
        const project = data.project;
        document.getElementById("key").value = project.key || key;
        document.getElementById("title").value = project.title || "";
        document.getElementById("caption").value = project.caption || "";
        document.getElementById("positionMode").value = "keep";
        positionKeyEl.value = "";
        document.getElementById("replace").checked = true;
        document.getElementById("prefix").value = inferPrefixFromItems(project.items || []);

        rows = (project.items || []).map((item) => ({
          rowId: nextRowId++,
          file: null,
          type: item.type || typeOf(item.url || ""),
          relName: fileNameOnly(String(item.url || "")),
          sourceUrl: String(item.url || ""),
          sortTs: 0,
        }));
        render();
        setStatus(`Loaded ${project.key}. You can reorder/remove/add media, then click save.`, "ok");
      } catch (err) {
        setStatus(`Could not load project. ${err.message}`, "err");
      }
    }

    async function submitProject() {
      const key = document.getElementById("key").value.trim();
      const title = document.getElementById("title").value.trim();
      const caption = document.getElementById("caption").value.trim();
      const category = document.getElementById("category").value;
      const positionMode = document.getElementById("positionMode").value;
      const positionKey = (positionKeyEl.value || "").trim();
      const replace = document.getElementById("replace").checked;
      const dryRun = document.getElementById("dryRun").checked;
      const media = collectMediaPaths();

      if (!key || !title || !caption) {
        setStatus("Please fill project key, title, and caption.", "err");
        return;
      }
      if (!media.length) {
        setStatus("Please select at least one media file.", "err");
        return;
      }

      setStatus("Saving project...", "");
      try {
        const res = await fetch("/api/add-project", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            category,
            key,
            title,
            caption,
            position_mode: positionMode,
            position_key: positionKey,
            replace,
            dry_run: dryRun,
            media,
          }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Request failed");
        if (data.dry_run) {
          setStatus(`Dry run OK: ${data.count} media items (${data.images} images, ${data.videos} videos).`, "ok");
        } else {
          setStatus(`Saved ${data.project} to ${data.updated} with ${data.count} media items.`, "ok");
          document.getElementById("replace").checked = true;
          void refreshProjectList();
        }
      } catch (err) {
        setStatus(`Could not save. ${err.message}. Make sure you started scripts/project_helper_server.py`, "err");
      }
    }

    document.getElementById("pickFolder").addEventListener("click", () => folderInput.click());
    document.getElementById("pickFiles").addEventListener("click", () => filesInput.click());
    document.getElementById("loadProject").addEventListener("click", () => { void loadProjectForEdit(); });
    document.getElementById("clearAll").addEventListener("click", () => {
      rows = [];
      render();
      setStatus("Cleared media list.", "");
    });
    folderInput.addEventListener("change", () => { void addFiles(folderInput.files); });
    filesInput.addEventListener("change", () => { void addFiles(filesInput.files); });
    document.getElementById("submit").addEventListener("click", submitProject);

    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => e.preventDefault());
    document.getElementById("category").addEventListener("change", () => { void refreshProjectList(); });
    void refreshProjectList();
  </script>
</body>

</html>
